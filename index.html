    <link rel="apple-touch-icon" href="/icons/favicon-144.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Instrument+Serif:ital@0;1&display=swap"

    />

    <meta name="twitter:card" content="summary" />

      content="Your credentials are never shared with us. They are sent directly to CyberVidya and your session is stored locally."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CyberVidya",
        "alternateName": "KIET Attendance - CyberVidya",
        "url": "https://kietcybervidya.pages.dev/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "KIET Attendance - CyberVidya",
        "url": "https://kietcybervidya.pages.dev/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any"
      }
    </script>
  </head>
  <body>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch {}
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <h1>KIET Attendance - CyberVidya</h1>
      <p>
        Your credentials are never shared with us. They are sent directly to CyberVidya and your session is stored locally.
      </p>
      <p>
        An unofficial KIET CyberVidya attendance tracker: overall percentage,
        course-wise breakdown, calendar view and a bunk planner for KIET
        students. It is not affiliated with CyberVidya or KIET. Please enable
        JavaScript to use it.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
